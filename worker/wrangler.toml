name = "famorga-api"
main = "index.js"
compatibility_date = "2024-11-01"

# Workers AI für die KI-Erkennung (Vision-Modell, läuft direkt im
# Cloudflare-Konto, kostenloses Tageskontingent, kein separater API-Key).
[ai]
binding = "AI"

# Optional: anderes Modell verwenden, ohne Code zu ändern.
# [vars]
# AI_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"

# KV-Namespace zum Spiegeln der Termine für den .ics-Kalender-Feed.
# Erst anlegen mit: npx wrangler kv namespace create FAMORGA_KV
# und die zurückgegebene id hier eintragen.
[[kv_namespaces]]
binding = "FAMORGA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
