name = "famorga-api"
main = "index.js"
compatibility_date = "2024-11-01"

# Workers AI für die KI-Erkennung (Vision-Modell, läuft direkt im
# Cloudflare-Konto, kostenloses Tageskontingent, kein separater API-Key).
[ai]
binding = "AI"

# Vision-Modell für die KI-Erkennung. Standard ist Mistral Small 3.1
# (vision-fähig, Apache-2.0, ohne EU-Lizenzsperre). Llama 3.2 Vision ist
# bewusst NICHT gesetzt, weil Metas Lizenz EU-Nutzer ausschließt.
[vars]
AI_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"

# KV-Namespace zum Spiegeln der Termine für den .ics-Kalender-Feed.
# Erst anlegen mit: npx wrangler kv namespace create FAMORGA_KV
# und die zurückgegebene id hier eintragen.
[[kv_namespaces]]
binding = "FAMORGA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
