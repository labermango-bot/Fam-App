name = "famorga-api"
main = "index.js"
compatibility_date = "2024-11-01"

# Modell für die KI-Erkennung (Vision-fähig). Kann ohne Code-Änderung
# angepasst werden, z. B. auf ein günstigeres oder neueres Modell.
[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"

# KV-Namespace zum Spiegeln der Termine für den .ics-Kalender-Feed.
# Erst anlegen mit: npx wrangler kv namespace create FAMORGA_KV
# und die zurückgegebene id hier eintragen.
[[kv_namespaces]]
binding = "FAMORGA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
